services:
  kong-database:
    image: postgres:13
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong-pg
    ports: 
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks:
      - rjshub-network

  kong-migrations:
    image: kong/kong-gateway:3.10.0.2
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-pg
      KONG_PASSWORD: kong-migrations-pwd
    command: kong migrations bootstrap
    networks:
      - rjshub-network

  kong:
    image: kong/kong-gateway:3.10.0.2
    container_name: kong
    depends_on:
      - kong-database
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-pg
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444
    ports:
      - "127.0.0.1:8000:8000"      # HTTP traffic
      - "127.0.0.1:8001:8001"      # Admin API HTTP
    restart: unless-stopped
    networks:
      - rjshub-network

networks:
  rjshub-network:
    external: true
